name: Process Import Queue

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:

# Prevent parallel runs: if a run is already in progress, let it finish
# (cancel-in-progress: false) and block additional runs from starting.
# This avoids hammering Gemini quota with concurrent requests.
concurrency:
  group: process-import-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions: {}  # Restrict GITHUB_TOKEN to minimum required permissions
    steps:
      - name: Process one pending import chunk
        run: |
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "${{ secrets.VERCEL_APP_URL }}/api/process-chunk" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              --max-time 55
          )"
          BODY="$(cat "$RESPONSE_FILE")"

          echo "process-chunk HTTP: $HTTP_CODE"
          echo "process-chunk body: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::process-chunk failed with HTTP $HTTP_CODE"
            exit 1
          fi

          if command -v jq > /dev/null 2>&1; then
            if jq -e '.status == "nothing_pending"' "$RESPONSE_FILE" > /dev/null; then
              echo "ℹ️ No hay chunks pendientes por procesar en este ciclo."
            fi
          elif echo "$BODY" | grep -q '"status":"nothing_pending"'; then
            echo "ℹ️ No hay chunks pendientes por procesar en este ciclo."
          fi
